<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — ExplorerFrame</title>
  <link rel="icon" type="image/x-icon" href="/app/app-icon.ico" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<nav>
  <a class="nav-logo" href="/">
    <svg class="hex-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/>
    </svg>
    Explorer<span>Frame</span>
  </a>
  <div class="nav-links">
    <a href="/register/" class="btn-nav">Registrarse</a>
  </div>
</nav>

<div class="auth-wrapper">
  <div class="auth-card glass-card">
    <div class="logo">
      <h2>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
          <path d="M12 2L2 7v10l10 5 10-5V7L12 2z"/>
        </svg>
        ExplorerFrame
      </h2>
      <p>Iniciar sesión</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login/">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Tu nombre de usuario" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               placeholder="Tu contraseña" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        Iniciar sesión →
      </button>
    </form>

    <div class="telegram-login-wrapper">
      <p class="telegram-label">O inicia sesión con:</p>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
        <div class="telegram-widget">
          <script async src="https://telegram.org/js/telegram-widget.js?23"
            data-telegram-login="explorerframebot"
            data-size="large"
            data-onauth="onTelegramAuth(user)"
            data-request-access="write">
          </script>
        </div>
      </div>
    </div>

    <div class="auth-divider">o</div>

    <div class="social-login">
      <a href="/github/" class="btn btn-outline" style="width:100%;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        Iniciar con GitHub
      </a>
    </div>

    <div class="guest-link">
      <a href="/dashboard/">Continuar como invitado →</a>
    </div>

    <div class="auth-footer">
      ¿No tienes cuenta? <a href="/register/">Regístrate</a>
    </div>
  </div>
</div>

<script type="text/javascript">
function onTelegramAuth(user) {
  // Mostrar información de la cuenta en la consola
  console.info('Datos de la cuenta:', {
    id: user.id,
    first_name: user.first_name,
    last_name: user.last_name || 'N/A',
    username: user.username || 'N/A',
    photo_url: user.photo_url || 'N/A',
    auth_date: user.auth_date,
    hash: user.hash
  });

  // Enviar datos de Telegram al servidor
  fetch('/telegram-login/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(user)
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      // Redirigir al dashboard
      window.location.href = '/dashboard/';
    } else {
      alert('Error: ' + (data.error || 'No se pudo iniciar sesión'));
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('Error al conectar con el servidor');
  });
}
</script>

</body>
</html>
