<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Console - ExplorerFrame</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card { background: #1a1a2e; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .app-item { border-bottom: 1px solid #333; padding: 15px 0; }
        .app-item:last-child { border-bottom: none; }
        .btn { background: #e94560; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #c73e54; }
        .btn-secondary { background: #16213e; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #0f0f23; border: 1px solid #333; color: white; border-radius: 5px; }
        .credentials { background: #0f0f23; padding: 15px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Developer Console</h1>
            <a href="/dashboard">← Back to Dashboard</a>
        </div>
        
        <div class="card">
            <h2>Create New App</h2>
            <form id="createAppForm">
                <input type="text" id="appName" placeholder="App Name" required>
                <input type="text" id="redirectUri" placeholder="Redirect URI (e.g., https://example.com/callback)" required>
                <button type="submit" class="btn">Create App</button>
            </form>
            <div id="createdApp" class="credentials" style="display: none;">
                <h3>New App Created!</h3>
                <p><strong>Client ID:</strong> <span id="newClientId"></span></p>
                <p><strong>Client Secret:</strong> <span id="newClientSecret"></span></p>
                <p style="color: #e94560;">Save the client secret now - it won't be shown again!</p>
            </div>
        </div>
        
        <div class="card">
            <h2>Your Apps</h2>
            <div id="appsList">Loading...</div>
        </div>
    </div>
    
    <script>
        async function loadApps() {
            try {
                const res = await fetch('/api/v1/dev/apps');
                const apps = await res.json();
                const container = document.getElementById('appsList');
                
                if (apps.length === 0) {
                    container.innerHTML = '<p>No apps yet. Create one above!</p>';
                    return;
                }
                
                container.innerHTML = apps.map(app => `
                    <div class="app-item">
                        <h3>${app.name}</h3>
                        <p><strong>Client ID:</strong> ${app.client_id}</p>
                        <p><strong>Redirect URIs:</strong> ${app.redirect_uris.join(', ')}</p>
                        <p><small>Created: ${new Date(app.created_at).toLocaleDateString()}</small></p>
                        <button class="btn btn-secondary" onclick="deleteApp('${app.client_id}')">Delete</button>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('appsList').innerHTML = '<p style="color: red;">Error loading apps</p>';
            }
        }
        
        document.getElementById('createAppForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('appName').value;
            const redirectUri = document.getElementById('redirectUri').value;
            
            try {
                const res = await fetch('/api/v1/dev/apps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, redirect_uris: [redirectUri] })
                });
                
                if (res.ok) {
                    const app = await res.json();
                    document.getElementById('newClientId').textContent = app.client_id;
                    document.getElementById('newClientSecret').textContent = app.client_secret;
                    document.getElementById('createdApp').style.display = 'block';
                    document.getElementById('appName').value = '';
                    document.getElementById('redirectUri').value = '';
                    loadApps();
                }
            } catch (err) {
                alert('Error creating app');
            }
        });
        
        async function deleteApp(clientId) {
            if (!confirm('Are you sure you want to delete this app?')) return;
            
            try {
                await fetch(`/api/v1/dev/apps/${clientId}`, { method: 'DELETE' });
                loadApps();
            } catch (err) {
                alert('Error deleting app');
            }
        }
        
        loadApps();
    </script>
</body>
</html>
