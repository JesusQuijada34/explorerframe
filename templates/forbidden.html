<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso denegado - ExplorerFrame</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .error-code { font-size: 6rem; font-weight: 700; color: var(--red); opacity: 0.3; }
    .error-title { font-size: 1.5rem; margin: 1rem 0; }
    .error-msg { color: var(--muted); margin-bottom: 2rem; }
  </style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">⬡ Explorer<span>Frame</span></a>
</nav>
<div class="error-page">
  <div>
    <div class="error-code">403</div>
    <h1 class="error-title">Acceso denegado</h1>
    <p class="error-msg">No tienes permiso para acceder a este recurso.</p>
    <a href="/" class="btn btn-primary">← Volver al inicio</a>
  </div>
</div>
</body>
</html>
